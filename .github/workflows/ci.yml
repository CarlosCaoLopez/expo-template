name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint backend
        run: pnpm --filter @expo-app/backend lint

      - name: Test backend
        run: pnpm --filter @expo-app/backend test

      - name: Lint Expo app
        run: pnpm --filter @expo-app/mobile lint

      - name: Type check workspace
        run: pnpm typecheck

      - name: Build workspace
        run: pnpm build